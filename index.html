<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generate and copy secure UUID v4 values in your browser."
    />
    <title>UUID Generator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #182235;
        background: #f7f8fc;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --indigo: #4939db;
        --indigo-dark: #3829bd;
        --muted: #697386;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 48px 24px;
      }

      main {
        width: min(100%, 820px);
        text-align: center;
      }

      .mark {
        width: 68px;
        height: 68px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        color: var(--indigo);
        background: #e9e7ff;
      }

      .mark svg { width: 34px; height: 34px; }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 6vw, 3.4rem);
        line-height: 1.12;
        letter-spacing: -0.045em;
      }

      .intro {
        margin: 14px 0 48px;
        color: var(--muted);
        font-size: clamp(1rem, 2.8vw, 1.25rem);
      }

      .card {
        padding: 32px;
        border: 1px solid #e1e5ed;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(31 42 68 / 8%);
      }

      .label {
        margin: 0 0 16px;
        color: #596273;
        font-size: 0.82rem;
        font-weight: 750;
        letter-spacing: 0.09em;
        text-align: left;
      }

      .uuid {
        margin: 0;
        overflow-wrap: anywhere;
        color: #182235;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
        font-size: clamp(1.05rem, 3vw, 1.7rem);
        line-height: 1.5;
        letter-spacing: 0.015em;
      }

      .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      button {
        min-height: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 22px;
        border: 1px solid transparent;
        border-radius: 11px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: background-color 140ms ease, border-color 140ms ease,
          transform 140ms ease;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      button:focus-visible { outline: 3px solid #aaa3ff; outline-offset: 3px; }
      button svg { width: 20px; height: 20px; flex: none; }

      .primary { color: #fff; background: var(--indigo); }
      .primary:hover { background: var(--indigo-dark); }
      .secondary { color: #253047; border-color: #ccd2de; background: #fff; }
      .secondary:hover { background: #f7f8fc; border-color: #aeb6c6; }

      .note {
        min-height: 24px;
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 520px) {
        body { padding: 32px 18px; }
        .intro { margin-bottom: 32px; }
        .card { padding: 24px 20px; border-radius: 18px; }
        .actions { flex-direction: column; }
        button { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1.5c1.8 5.9 3.1 7.2 10.5 10.5-7.4 3.3-8.7 4.6-10.5 10.5C10.2 16.6 8.9 15.3 1.5 12 8.9 8.7 10.2 7.4 12 1.5Z" />
        </svg>
      </div>
      <h1>UUID Generator</h1>
      <p class="intro">Create a unique ID in one click.</p>

      <section class="card" aria-labelledby="uuid-label">
        <p class="label" id="uuid-label">YOUR UUID</p>
        <p class="uuid" id="uuid" aria-live="polite"></p>

        <div class="actions">
          <button class="primary" id="generate" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 7v5h-5M4 17v-5h5" />
              <path d="M5.6 9A7 7 0 0 1 18 6.5L20 12M4 12l2 5.5A7 7 0 0 0 18.4 15" />
            </svg>
            Generate new
          </button>
          <button class="secondary" id="copy" type="button" aria-label="Copy UUID">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="8" width="13" height="13" rx="2" />
              <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
            </svg>
            Copy
          </button>
        </div>
        <p class="note" id="status" role="status">UUID v4 · Generated securely in your browser</p>
      </section>
    </main>

    <script>
      const uuidDisplay = document.querySelector("#uuid");
      const status = document.querySelector("#status");
      let statusTimer;

      function generateUuid() {
        if (typeof crypto.randomUUID !== "function") {
          status.textContent = "Secure UUID generation is not supported in this browser.";
          return;
        }

        uuidDisplay.textContent = crypto.randomUUID();
        status.textContent = "UUID v4 · Generated securely in your browser";
      }

      document.querySelector("#generate").addEventListener("click", generateUuid);

      document.querySelector("#copy").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(uuidDisplay.textContent);
          status.textContent = "Copied to clipboard!";
          clearTimeout(statusTimer);
          statusTimer = setTimeout(() => {
            status.textContent = "UUID v4 · Generated securely in your browser";
          }, 1800);
        } catch {
          status.textContent = "Could not copy. Check your browser clipboard permissions.";
        }
      });

      generateUuid();
    </script>
  </body>
</html>
